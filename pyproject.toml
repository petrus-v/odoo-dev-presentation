[project]
name = "ocadays"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pierre Verkest", email = "pierre@verkest.fr" }
]
requires-python = ">=3.14"
dependencies = [
  "odoo>=19.0",
  "lxml>=5.2.1",
  "lxml_html_clean",
  "Werkzeug==3.0.1",
  "PyPDF==5.4.0",
  "freezegun",
]

[tool.uv]
exclude-dependencies = ["PyPDF2"]

[tool.uv.sources]
odoo = {git = "https://github.com/OCA/OCB.git", branch = "19.0"}

[tool.hatch.build.targets.wheel]
packages = ["src/odoo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
