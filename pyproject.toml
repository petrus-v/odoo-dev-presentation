[project]
name = "ocadays"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pierre Verkest", email = "pierre@verkest.fr" }
]
requires-python = ">=3.14"
dependencies = [
  "odoo>=19.0",
  "lxml>=5.2.1",
  "lxml_html_clean",
  "Werkzeug==3.0.1",
  "PyPDF==5.4.0",
  "freezegun",
  "odoo-addon-mis-builder>=19.0.1.2.0.2",
]

[tool.uv]
exclude-dependencies = ["PyPDF2"]

[tool.uv.sources]
odoo = {git = "https://github.com/OCA/OCB.git", branch = "19.0"}

[tool.hatch.build.targets.wheel]
packages = ["src/odoo"]

# Enable the hatch-odoo build hook to package the Odoo addons into odoo/addons.
[tool.hatch.build.hooks.odoo-addons-dirs]

[tool.hatch-odoo]
# Our addons are in the project root directory.
addons_dirs = ["src/odoo/addons"]


[build-system]
requires = ["hatchling", "hatch-odoo"]
build-backend = "hatchling.build"
